<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>AccessMap · Side navigation</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5FAFD;--soft:#EAF3F7;--ink:#0F172A;--mute:#475569;--line:#0F172A;--accent:#21524B;--accent-l:#E7F2F0;--grid:#D5E5EC;--on-accent:#FFFFFF;--side:248px;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.55 "Space Grotesk",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid #38BDF8;outline-offset:2px}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg i{position:absolute;inset:-80px;background-image:radial-gradient(circle at 1px 1px,rgba(15,23,42,.07) 1.2px,transparent 0);background-size:36px 36px;animation:drift 45s linear infinite}
@keyframes drift{to{transform:translate(36px,36px)}}
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100%;width:100%}
body.collapsed{--side:68px}
.side{background:#fff;border-right:1.5px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;overflow-y:auto;overflow-x:hidden;min-height:0}
.brand{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:20px;letter-spacing:-.02em}
.logo-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line)}
.logo-mark svg{width:17px;height:17px}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid transparent;background:transparent;display:grid;place-items:center;color:var(--mute);padding:0}
.icon-btn:hover{border-color:var(--line);color:var(--ink);background:#fff}
.ws{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;box-shadow:0 2px 0 var(--line);margin-bottom:14px}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.ws .av{width:30px;height:30px;font-size:11px}
.ws b{display:block;font-size:13px;line-height:1.2}.ws small{color:var(--mute);font-size:11px}
.ws>svg{margin-left:auto;color:var(--mute);width:15px;height:15px}
.grp{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:10px;letter-spacing:.09em;margin:14px 6px 6px}
.grp::after{content:"";flex:1;height:1px;background:var(--grid)}
.nav{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;font-weight:500;font-size:13.5px;border:1.5px solid transparent;white-space:nowrap;color:var(--ink);text-decoration:none}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--accent-l);border-color:var(--line);box-shadow:0 2px 0 var(--line);font-weight:700}
.nav .beta{margin-left:auto;font-size:9px;font-weight:700;color:var(--accent);background:var(--accent-l);border-radius:6px;padding:2px 6px;border:1px solid rgba(33,82,75,.35)}
.promo{margin-top:auto;display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);border-radius:12px;padding:10px;background:linear-gradient(135deg,#fff,var(--accent-l));text-align:left;width:100%}
.promo .ic{width:36px;height:36px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--accent);flex:none;box-shadow:none}
.promo b{display:block;font-size:13px;line-height:1.2}.promo small{color:var(--mute);font-size:11px;line-height:1.3;display:block}
body.collapsed .side{padding:16px 10px}
body.collapsed .brand{flex-direction:column;gap:8px;padding-bottom:10px}
body.collapsed .logo span,body.collapsed .ws div,body.collapsed .ws>svg,body.collapsed .nav span,body.collapsed .nav .beta,body.collapsed .promo div{display:none}
body.collapsed .ws,body.collapsed .nav,body.collapsed .promo{justify-content:center;padding:9px}
body.collapsed .grp{display:block;margin:8px 0;height:1px;background:var(--grid);font-size:0}
body.collapsed .grp::after{display:none}

.page{padding:32px;overflow-y:auto;height:100%}
.page h1{margin:0 0 6px;font-size:28px;letter-spacing:-.02em}.page p{margin:0;color:var(--mute)}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute;width:0;height:0" aria-hidden="true"><defs>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 12h.01M12 12h.01M15 12h.01"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></symbol>
<symbol id="i-bars" viewBox="0 0 24 24"><path d="M6 20V11M12 20V5M18 20v-7"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
<symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></symbol>
<symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
<symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
<symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1"/></symbol>
</defs></svg>
<div class="bg"><i></i></div>
<div class="app">
<aside class="side" aria-label="Primary">
  <div class="brand"><div class="logo"><div class="logo-mark"><svg><use href="#i-pin"/></svg></div><span>AccessMap</span></div>
  <button class="icon-btn" id="collapse" aria-label="Collapse sidebar"><svg><use href="#i-sidebar"/></svg></button></div>
  <button class="ws" type="button"><span class="av">AD</span><div><b>My workspace</b><small>Alex David</small></div><svg><use href="#i-chev"/></svg></button>
  <a class="nav" href="#" title="Community"><svg><use href="#i-globe"/></svg><span>Community</span><span class="beta">BETA</span></a><a class="nav" href="#" title="Dashboard"><svg><use href="#i-grid"/></svg><span>Dashboard</span></a><a class="nav" href="#" title="Messages"><svg><use href="#i-chat"/></svg><span>Messages</span></a>
  <div class="grp">IDENTITY</div>
  <a class="nav on" href="#" title="Profile" aria-current=page><svg><use href="#i-user"/></svg><span>Profile</span></a><a class="nav" href="#" title="Saved places"><svg><use href="#i-bookmark"/></svg><span>Saved places</span></a><a class="nav" href="#" title="Contribution history"><svg><use href="#i-bars"/></svg><span>Contribution history</span></a>
  <div class="grp">EXPLORE</div>
  <a class="nav" href="#" title="Map view"><svg><use href="#i-pin"/></svg><span>Map view</span></a><a class="nav" href="#" title="AI vision"><svg><use href="#i-sparkle"/></svg><span>AI vision</span></a>
  <div class="grp">SETTINGS</div>
  <a class="nav" href="#" title="Tags &amp; badges"><svg><use href="#i-tag"/></svg><span>Tags &amp; badges</span></a><a class="nav" href="#" title="Filter settings"><svg><use href="#i-sliders"/></svg><span>Filter settings</span></a>
  <button class="promo" type="button" id="invite"><span class="ic"><svg><use href="#i-user"/></svg></span><div><b>Invite a mapper</b><small>Bring neighbors in to verify places.</small></div></button>
</aside>
<main class="page"><h1>Page content</h1><p>Replace this area with your page. The sidebar is self-contained: copy the CSS, the SVG sprite, the &lt;aside&gt; and the script.</p></main>
</div>
<script>
const nav=document.querySelector('.side');
document.getElementById('collapse').onclick=()=>document.body.classList.toggle('collapsed');
document.getElementById('invite').onclick=()=>alert('Invite link copied');
nav.querySelectorAll('.nav').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();nav.querySelectorAll('.nav').forEach(x=>{x.classList.remove('on');x.removeAttribute('aria-current')});a.classList.add('on');a.setAttribute('aria-current','page')}));
</script>
</body>
</html>
