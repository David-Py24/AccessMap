name: Sync AccessMap-Frontend-Architecture -> main

on:
  push:
    branches: [AccessMap-Frontend-Architecture]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: sync-frontend-arch-to-main
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open PR if branch is ahead
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin main AccessMap-Frontend-Architecture
          AHEAD=$(git rev-list --count origin/main..origin/AccessMap-Frontend-Architecture)
          if [ "$AHEAD" -eq 0 ]; then
            echo "Nothing to sync (branch is not ahead)."
            exit 0
          fi
          EXISTING=$(gh pr list --base main --head AccessMap-Frontend-Architecture --state open --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open; branch updates will refresh it."
            exit 0
          fi
          gh pr create \
            --base main \
            --head AccessMap-Frontend-Architecture \
            --title "Sync AccessMap-Frontend-Architecture into main" \
            --body "Automated PR to bring backend changes from \`AccessMap-Frontend-Architecture\` into \`main\`. Review and merge manually."
